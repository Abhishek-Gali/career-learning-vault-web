<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#080c14" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Wing Gradient (Neon Emerald -> Spring Mint) -->
    <linearGradient id="leftWing" x1="0%" y1="100%" x2="70%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Right Wing Gradient (Electric Cyan -> Royal Blue) -->
    <linearGradient id="rightWing" x1="30%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Floating Cyber Crossbar Gradient (Emerald -> Cyan -> Coral Pulse) -->
    <linearGradient id="crossbarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="40%" stop-color="#06b6d4" />
      <stop offset="75%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Rim -->
  <rect x="8" y="8" width="496" height="496" rx="116" ry="116" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="12" />

  <!-- Ambient Radial Glow -->
  <circle cx="256" cy="245" r="190" fill="url(#centerGlow)" />

  <!-- Master 'A' Emblem -->
  <g filter="url(#shadowA)">
    <!-- Left Wing -->
    <path d="M 256 72 L 90 400 L 164 400 L 204 316 L 256 182 Z" fill="url(#leftWing)" />

    <!-- Right Wing -->
    <path d="M 256 72 L 256 182 L 308 316 L 348 400 L 422 400 Z" fill="url(#rightWing)" />

    <!-- 3D Center Apex Highlight Crease -->
    <line x1="256" y1="72" x2="256" y2="182" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- Floating Cyber Crossbar -->
    <rect x="162" y="274" width="188" height="42" rx="21" ry="21" fill="url(#crossbarGrad)" />

    <!-- Luminescent Core Light Streak -->
    <rect x="176" y="282" width="160" height="24" rx="12" ry="12" fill="#ffffff" fill-opacity="0.4" />
    <rect x="196" y="288" width="120" height="12" rx="6" ry="6" fill="#ffffff" fill-opacity="0.75" />
  </g>
</svg>