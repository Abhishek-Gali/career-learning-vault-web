    <h2>Question 1</h2>
    <p>Which AWS service provides on-demand resizable compute capacity in the cloud?</p>
    <ul>
        <li>A. Amazon EC2</li>
        <li>B. AWS Lambda</li>
        <li>C. Amazon S3</li>
        <li>D. AWS Batch</li>
    </ul>
    <p>Answer: A</p>
    <p>Explanation: Amazon Elastic Compute Cloud (Amazon EC2) provides scalable computing capacity in the Amazon Web Services Cloud.</p>
