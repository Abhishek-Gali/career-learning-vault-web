services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - SEARXNG_URL=http://searxng:8080
      - LOG_LEVEL=INFO

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    profiles:
      - search
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
